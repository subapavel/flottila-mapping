# Parallel worktrees must not clash on the test port (ADR-0017).
quarkus.http.test-port=0
# The service is a local dev tool: loopback only, in every profile (ADR-0014). ServiceConfig warns otherwise.
quarkus.http.host=127.0.0.1
# The workspace (ADR-0014, ADR-0024). No default, so prod fails fast without one.
%dev.flottila.mapping.workspace=../corpus
# Request bodies are strict: an unknown member is invalid-request (ADR-0024).
quarkus.jackson.fail-on-unknown-properties=true
# An absent Optional is an absent member, never null (ADR-0024, "Results").
quarkus.jackson.serialization-inclusion=non-absent
# A body that does not bind is our invalid-request problem, not the built-in 400 (ProblemMappers).
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper
# Code-first contract, committed. openapi.yaml is ignored by the VCS because it cannot be switched off (ADR-0015, ADR-0017).
quarkus.smallrye-openapi.store-schema-directory=../contract
# No servers entry and no generated 400 responses: the contract holds only what the code declares (#28).
quarkus.smallrye-openapi.auto-add-server=false
quarkus.smallrye-openapi.auto-add-bad-request-response=false
# A test run past this is the runtime error flottila:TIMEOUT (ADR-0014, "Running"); a run is interrupted, never stopped.
flottila.mapping.test-timeout=10s
# The most slots, contexts or occurrence records one trace entry of a test run keeps; above it the entry is capped (ADR-0015, "Trace").
flottila.mapping.trace-limit=10000
# The time zone of every run, a ZoneId: a date without an offset is read in it, and every date is written in it (#80). A zone that is none stops the startup.
flottila.mapping.time-zone=UTC
