# Parallel worktrees must not clash on the test port (ADR-0017).
quarkus.http.test-port=0
# The service is a local dev tool: loopback only (ADR-0014).
quarkus.http.host=127.0.0.1
# Code-first contract, committed. openapi.yaml is ignored by the VCS because it cannot be switched off (ADR-0015, ADR-0017).
quarkus.smallrye-openapi.store-schema-directory=../contract
